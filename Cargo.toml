[package]
name = "recstrap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "LevitateOS install tools: recstrap (extract the rootfs), recchroot (enter it), recfstab (generate its fstab)"

[lib]
name = "install_tools"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
distro-spec = { path = "../../distro/spec" }
libc = "0.2"
nix = { version = "0.29", features = ["mount", "signal", "user"] }

[dev-dependencies]
tempfile = "3"
