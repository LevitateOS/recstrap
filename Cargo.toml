[package]
name = "recstrap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "LevitateOS install tools: recstrap (extract the rootfs), recchroot (enter it), recfstab (generate its fstab), recsetup (configure and boot it)"

[lib]
name = "install_tools"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
recinit = { path = "../recinit" }
libc = "0.2"
nix = { version = "0.29", features = ["mount", "signal", "user"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
