[package]
name = "recstrap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "LevitateOS install tools: recstrap (extract the rootfs), recchroot (enter it), recfstab (generate its fstab), recsetup (configure and boot it)"

[lib]
name = "install_tools"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
recinit = { path = "../recinit" }
distro-profile = { path = "../../distro/profile" }
target-root = { path = "target-root" }
libc = "0.2"
nix = { version = "0.29", features = ["mount", "signal", "user"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "1", optional = true }
ts-rs = { version = "12", optional = true }

[features]
# Derive the JSON Schemas and TypeScript declarations of the JSON output
# (`cargo xtask gen`); the shipped tools do not need them.
contracts = ["dep:schemars", "dep:ts-rs"]

[dev-dependencies]
tempfile = "3"
